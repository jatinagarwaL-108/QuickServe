{% if booking.status == 'Completed' and not booking.review %}
<form method="post" action="{{ url_for('customer.rate_service', booking_id=booking.id) }}" class="mt-2">
  <select name="rating" class="form-select form-select-sm mb-1" required>
    <option value="">Rate this service</option>
    {% for n in [5, 4, 3, 2, 1] %}<option value="{{ n }}">{{ n }} ★</option>{% endfor %}
  </select>
  <textarea name="text" class="form-control form-control-sm mb-1" rows="2" maxlength="1000"
            placeholder="Write a short review (optional)"></textarea>
  <button class="btn btn-sm btn-primary" type="submit">Submit review</button>
</form>
{% elif booking.review %}
  <span class="text-muted">Your review: {{ booking.review.rating }} ★</span>
{% endif %}
